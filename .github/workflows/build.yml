name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Create Android Folder
      run: flutter create --platforms=android .

    # این بخش جدید اضافه شده تا باگ image_picker رو دور بزنه
    - name: Disable Lint Bug
      run: |
        echo '<?xml version="1.0" encoding="UTF-8"?>
        <lint>
            <issue id="CommentDetector" severity="ignore" />
        </lint>' > android/app/lint.xml

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Parvaz-APK
        path: build/app/outputs/flutter-apk/app-release.apk
